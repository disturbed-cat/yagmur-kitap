<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Analiz Masası">
<meta name="theme-color" content="#EDF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E16" media="(prefers-color-scheme: dark)">
<title>Deneme Analiz Masası</title>
<style>
/* ===== Ortak cam tasarım dili: Deneme Analiz Masası + Kitaplarım + Öğretmen paneli ===== */
:root{
  color-scheme:light;
  --bg:#EDF1F7; --surface:#FFFFFF; --sunk:rgba(110,122,148,.12); --line:rgba(56,68,96,.15);
  --ink:#121924; --muted:#5D6779; --accent:#0A66E8; --accent-ink:#FFFFFF; --accent-soft:rgba(10,102,232,.12);
  --mark:#E0306E; --mark-soft:rgba(224,48,110,.12);
  --ok:#17894D; --ok-soft:rgba(23,137,77,.13); --bad:#D7372C; --bad-soft:rgba(215,55,44,.11); --blank:#B06500; --blank-soft:rgba(214,138,0,.15);
  --err:var(--bad);
  --card:rgba(255,255,255,.62); --card-edge:rgba(255,255,255,.78);
  --glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.58));
  --glass-edge:rgba(255,255,255,.85);
  --field:rgba(255,255,255,.72); --field-hover:rgba(255,255,255,.95);
  --pill:rgba(255,255,255,.97); --ring-gap:#FFFFFF; --sw-edge:rgba(0,0,0,.14);
  --hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3);
  --sh-1:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.08);
  --sh-2:0 2px 8px rgba(20,30,60,.08),0 22px 56px rgba(20,30,60,.18);
  --mesh:radial-gradient(70vmax 55vmax at 0% 0%,rgba(10,102,232,.20),transparent 62%),radial-gradient(55vmax 48vmax at 100% 6%,rgba(255,45,120,.14),transparent 62%),radial-gradient(70vmax 60vmax at 62% 100%,rgba(48,196,240,.17),transparent 62%);
  --blur:saturate(180%) blur(24px);
  --f-display:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,"SF Pro Text",BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --fs-h1:clamp(1.6rem,1.25rem + 1.3vw,2.15rem);
  --fs-h2:clamp(1.2rem,1.05rem + .7vw,1.55rem);
  --fs-h3:clamp(1.02rem,.97rem + .25vw,1.15rem);
  --r:14px; --r-lg:22px; --r-xl:28px;
  --spring:cubic-bezier(.3,1.32,.5,1); --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A0E16; --surface:#1B2232; --sunk:rgba(255,255,255,.07); --line:rgba(255,255,255,.11);
  --ink:#EEF2F8; --muted:#9AA5B8; --accent:#4D9DFF; --accent-ink:#04122B; --accent-soft:rgba(77,157,255,.17);
  --mark:#FF6FA0; --mark-soft:rgba(255,111,160,.15);
  --ok:#4CD38A; --ok-soft:rgba(76,211,138,.15); --bad:#FF7A70; --bad-soft:rgba(255,122,112,.15); --blank:#F2B45A; --blank-soft:rgba(242,180,90,.15);
  --card:rgba(30,38,56,.56); --card-edge:rgba(255,255,255,.08);
  --glass:linear-gradient(180deg,rgba(46,56,78,.74),rgba(26,33,48,.62));
  --glass-edge:rgba(255,255,255,.12);
  --field:rgba(255,255,255,.06); --field-hover:rgba(255,255,255,.11);
  --pill:rgba(255,255,255,.17); --ring-gap:#1B2232; --sw-edge:rgba(255,255,255,.3);
  --hi:inset 0 1px 0 rgba(255,255,255,.10);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sh-2:0 2px 8px rgba(0,0,0,.35),0 22px 56px rgba(0,0,0,.5);
  --mesh:radial-gradient(70vmax 55vmax at 0% 0%,rgba(30,110,255,.24),transparent 62%),radial-gradient(55vmax 48vmax at 100% 6%,rgba(255,45,120,.14),transparent 62%),radial-gradient(70vmax 60vmax at 62% 100%,rgba(30,180,220,.15),transparent 62%);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0E16; --surface:#1B2232; --sunk:rgba(255,255,255,.07); --line:rgba(255,255,255,.11);
  --ink:#EEF2F8; --muted:#9AA5B8; --accent:#4D9DFF; --accent-ink:#04122B; --accent-soft:rgba(77,157,255,.17);
  --mark:#FF6FA0; --mark-soft:rgba(255,111,160,.15);
  --ok:#4CD38A; --ok-soft:rgba(76,211,138,.15); --bad:#FF7A70; --bad-soft:rgba(255,122,112,.15); --blank:#F2B45A; --blank-soft:rgba(242,180,90,.15);
  --card:rgba(30,38,56,.56); --card-edge:rgba(255,255,255,.08);
  --glass:linear-gradient(180deg,rgba(46,56,78,.74),rgba(26,33,48,.62));
  --glass-edge:rgba(255,255,255,.12);
  --field:rgba(255,255,255,.06); --field-hover:rgba(255,255,255,.11);
  --pill:rgba(255,255,255,.17); --ring-gap:#1B2232; --sw-edge:rgba(255,255,255,.3);
  --hi:inset 0 1px 0 rgba(255,255,255,.10);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sh-2:0 2px 8px rgba(0,0,0,.35),0 22px 56px rgba(0,0,0,.5);
  --mesh:radial-gradient(70vmax 55vmax at 0% 0%,rgba(30,110,255,.24),transparent 62%),radial-gradient(55vmax 48vmax at 100% 6%,rgba(255,45,120,.14),transparent 62%),radial-gradient(70vmax 60vmax at 62% 100%,rgba(30,180,220,.15),transparent 62%);
}

/* ---- temel ---- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background-color:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh);pointer-events:none}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.018em;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:break-word}
h1{font-size:var(--fs-h1);letter-spacing:-.025em}
h2{font-size:var(--fs-h2)}
h3{font-size:var(--fs-h3)}
p,li,dd{text-wrap:pretty}
p,li,td,th,label,span,b,div{overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
::selection{background:var(--accent-soft)}

/* metin sığdırma */
.clamp-1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp-2,.clamp-3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clamp-2{-webkit-line-clamp:2}.clamp-3{-webkit-line-clamp:3}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ---- cam malzeme ---- */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1)}

/* ---- düğmeler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-weight:600;font-size:.95rem;line-height:1.2;text-align:center;box-shadow:var(--hi);transition:transform .45s var(--spring),background .2s,border-color .2s,box-shadow .25s,opacity .2s,filter .2s;-webkit-user-select:none;user-select:none}
.btn:hover{background:var(--field-hover)}
.btn:active:not([disabled]){transform:scale(.95);transition-duration:.12s}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:32px;padding:0 12px;font-size:.85rem}

/* ---- alanlar ---- */
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:42px;min-width:0;box-shadow:var(--hi);transition:border-color .2s,box-shadow .2s,background .2s}
input:hover,select:hover,textarea:hover{background:var(--field-hover)}
textarea{width:100%;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:20px;height:20px}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)!important}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* ---- ortak parçalar ---- */
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:sp .9s linear infinite;flex:none}
.skel{background:linear-gradient(100deg,var(--sunk) 30%,color-mix(in srgb,var(--surface) 60%,transparent) 50%,var(--sunk) 70%);background-size:300% 100%;animation:shimmer 1.5s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(18,24,34,.84);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:80;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--sh-2);animation:toastIn .5s var(--spring)}

@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.92)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(5%) scale(.985)}}
@keyframes sheetDown{to{opacity:0;transform:translateY(5%) scale(.985)}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(-6px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root{--card:rgba(255,255,255,.92);--glass:rgba(255,255,255,.95)}
}

/* ===== Deneme Analiz Masası ===== */
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:10px}
.top-glass{border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1);padding:8px 8px 8px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:4px 6px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .dots{display:grid;grid-template-columns:repeat(2,8px);gap:3px;padding:7px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--mark));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent);flex:none}
.brand .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.92)}
.brand .dots i.f{background:#fff}
.brand h1{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.who select{min-height:38px;padding:6px 12px;border-radius:999px;max-width:220px}
.who .btn{min-height:38px}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:999px;background:var(--sunk);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--pill);box-shadow:0 1px 2px rgba(0,0,0,.07),0 4px 14px rgba(20,30,60,.10),var(--hi);transition:transform .55s var(--spring),width .55s var(--spring);pointer-events:none;z-index:0}
.tab{position:relative;z-index:1;flex:none;background:none;border:0;border-radius:999px;padding:8px 15px;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap;transition:color .25s,transform .4s var(--spring)}
.tab:active{transform:scale(.95)}
.tab[aria-selected=true]{color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:.7rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 7px;margin-left:6px}

main{padding-block:22px 72px;display:grid;gap:18px}
#app.in-r>*{animation:inR .48s var(--ease) both}
#app.in-l>*{animation:inL .48s var(--ease) both}
#app.in-r>*:nth-child(2),#app.in-l>*:nth-child(2){animation-delay:40ms}
#app.in-r>*:nth-child(3),#app.in-l>*:nth-child(3){animation-delay:80ms}
#app.in-r>*:nth-child(n+4),#app.in-l>*:nth-child(n+4){animation-delay:110ms}

.panel,.card,.subj-acc{background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--card-edge);border-radius:var(--r-lg);box-shadow:var(--hi),var(--sh-1)}
.panel{padding:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.drop{display:block;border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:18px;padding:26px 20px;text-align:center;background:var(--sunk);transition:border-color .2s,background .2s,transform .4s var(--spring)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:4px}
.thumb{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;max-width:100%;background:var(--sunk);box-shadow:var(--sh-1);animation:fadeUp .4s var(--ease) both}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-open{display:block;width:100%;height:100%;padding:0;border:0;background:none}
.thumb-x{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:30px;height:30px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1;box-shadow:var(--sh-1)}
.thumb-n{position:absolute;top:6px;left:6px;min-width:26px;height:26px;border-radius:13px;background:rgba(18,24,34,.75);color:#fff;font-family:var(--f-mono);font-size:.78rem;font-weight:700;display:grid;place-items:center;padding:0 7px}
.thumb-c{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:3px;justify-content:center;padding:4px;border-radius:10px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.cc{font-family:var(--f-mono);font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 5px}
.cc-d{background:var(--ok-soft);color:var(--ok)}.cc-y{background:var(--bad-soft);color:var(--bad)}.cc-b{background:var(--blank-soft);color:var(--blank)}.cc-n{color:var(--muted);font-family:var(--f-body);font-weight:600}
.cam-btn{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 80%,var(--mark)));color:var(--accent-ink);border:0;border-radius:20px;padding:18px 20px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform .45s var(--spring),filter .2s}
.cam-btn:hover{filter:brightness(1.05)}
.cam-btn:active:not([disabled]){transform:scale(.98)}
.cam-btn svg{flex:none;width:32px;height:32px}
.cam-btn[disabled]{opacity:.5;cursor:not-allowed}
.cam-btn>span{display:grid;gap:2px;min-width:0}.cam-btn b{font-family:var(--f-display);font-size:1.18rem}.cam-btn .small{opacity:.88}

/* tam ekran sayfalar (çekim, çalışma, kitap) */
.cap,.play,.reader{background:var(--mesh),var(--bg)}
.cap:not([hidden]),.play:not([hidden]){animation:sheetUp .5s var(--spring)}
.play.closing{animation:sheetDown .26s ease forwards}
.cap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.cap-top{display:flex;align-items:center;gap:10px;margin:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));padding:8px 10px 8px 16px;border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1)}
.cap-top h2{font-size:1.12rem;margin-right:auto}
.cap-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));max-width:620px;width:100%;margin:0 auto;overflow-y:auto}
.cap-img{flex:1 1 auto;min-height:150px;max-height:46vh;display:flex;justify-content:center;background:var(--sunk);border-radius:20px;overflow:hidden;box-shadow:var(--sh-1)}
.cap-img img{max-width:100%;max-height:100%;object-fit:contain}
.cap-q{font-family:var(--f-display);font-weight:600;text-align:center}
.steppers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stp{display:grid;gap:8px;justify-items:stretch;border-radius:18px;padding:10px;background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--hi)}
.stp-l{text-align:center;font-weight:700;font-size:.95rem}
.stp.d .stp-l{color:var(--ok)}.stp.y .stp-l{color:var(--bad)}.stp.b .stp-l{color:var(--blank)}
.stp button{height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-size:1.3rem;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .35s var(--spring)}
.stp button:active{transform:scale(.92)}
.stp.d button{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}.stp.y button{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}.stp.b button{border-color:color-mix(in srgb,var(--blank) 55%,transparent)}
.stp input{height:58px;width:100%;text-align:center;font-family:var(--f-mono);font-size:1.75rem;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0}
.cap-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));padding:10px;border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1)}
.cap-bar .btn{min-height:54px;font-size:1.05rem}
.cap-bar .btn.next{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));border-color:transparent;color:var(--accent-ink)}
.cap-bar .btn.fin{background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 82%,#fff),var(--ok));border-color:transparent;color:#fff}
.cap-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

  .pl-tree{position:absolute;inset:0 auto 0 0;width:min(330px,86vw);z-index:3;transform:translateX(-106%);transition:transform .45s var(--spring);box-shadow:var(--sh-2);visibility:hidden;background:var(--glass)}
  .pl-tree.on{transform:none;visibility:visible}
  .pl-back{display:block;position:absolute;inset:0;z-index:2;background:rgba(10,15,25,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .pl-back.on{opacity:1;pointer-events:auto}
  .pl-bar .btn{padding:0 14px}
}
@media (max-width:420px){.pl-pos{display:none}.pl-bar{justify-content:space-between}}
@media print{.play,.reader{display:none!important}}
.pl-busy{display:flex;align-items:center;gap:12px;margin:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:16px;background:var(--accent-soft);flex:none}
.pl-busy .lbl{flex:1;min-width:0;font-size:.9rem}
.tr-foot{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.confirming{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
@media (max-width:600px){.ws{padding:20px 16px}.panel{padding:18px}}

/* ===== Kitaplarım: kitaplık ===== */
.bk-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:22px 18px;padding:4px 2px}
.bk-card{appearance:none;-webkit-appearance:none;border:0;padding:0;background:none;text-align:left;color:inherit;display:grid;gap:10px;align-content:start;cursor:pointer;min-width:0;transition:transform .5s var(--spring);animation:fadeUp .5s var(--ease) both;animation-delay:calc(min(var(--i,0),10) * 45ms)}
.bk-card:active{transform:scale(.96);transition-duration:.15s}
.bk-card:focus-visible{box-shadow:none!important}
.bk-card:focus-visible .bk-cover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 50%,transparent),var(--sh-2)}
.bk-cover{position:relative;display:block;aspect-ratio:1/1.414;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px rgba(20,30,60,.16);transition:box-shadow .3s,transform .5s var(--spring)}
@media (hover:hover){.bk-card:hover .bk-cover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 22px 44px rgba(20,30,60,.22)}}
.bk-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,0) 5%,rgba(255,255,255,.18) 7%,rgba(255,255,255,0) 14%),linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 35%);pointer-events:none}
.bk-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s ease}
.bk-cover img.on{opacity:1}
.bk-ph{position:absolute;inset:0}
.bk-info{display:grid;gap:4px;min-width:0;padding:0 2px}
.bk-name{font-weight:650;font-size:.98rem;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;letter-spacing:-.005em}
.bk-info .bar{height:4px;margin-top:4px}
.bk-info .bar i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--mark)))}
.bk-card.is-skel{cursor:default;pointer-events:none}
.skel-line{display:block;height:12px;border-radius:6px}
.skel-line.short{width:55%}

/* ===== Kitap okuyucu ===== */
.reader{position:fixed;inset:0;z-index:50;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;--stage-top:120px}
.r-bar{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1)}
.r-left{display:flex;align-items:center;gap:8px;flex:1 1 230px;min-width:0}
.r-back{flex:none;padding:0 14px 0 8px;gap:2px;min-height:40px}
.r-back svg{width:20px;height:20px}
.r-titles{min-width:0;display:grid;line-height:1.25}
.r-title{font-weight:700;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.r-status{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.r-status.warn{color:var(--blank)}
.r-group{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--sunk);flex:none}
.r-tools{display:flex;align-items:center;gap:8px;flex:0 1 auto;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:1px}
.r-tools::-webkit-scrollbar{display:none}
.ib{width:40px;height:40px;flex:none;border-radius:999px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0;transition:transform .4s var(--spring),background .2s,color .2s,box-shadow .2s}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active:not([disabled]){transform:scale(.86);transition-duration:.12s}
.ib.on{background:var(--pill);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.10),var(--hi)}
.ib[disabled]{opacity:.3;cursor:default}
.ib.sm{width:34px;height:34px}.ib.sm svg{width:18px;height:18px}
.r-pg{width:58px;height:34px!important;min-height:34px!important;padding:0 4px!important;text-align:center;border-radius:10px!important;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield;appearance:textfield}
.r-pg::-webkit-outer-spin-button,.r-pg::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.r-count{color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px 0 2px;font-size:.92rem;white-space:nowrap}
.sw{width:36px;height:36px;flex:none;border:0;padding:0;border-radius:50%;background:transparent;display:grid;place-items:center;transition:transform .4s var(--spring)}
.sw:active{transform:scale(.85);transition-duration:.12s}
.sw i{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--sw-edge);transition:transform .45s var(--spring),box-shadow .25s;display:grid;place-items:center;font-style:normal}
.sw.on i{transform:scale(.86);box-shadow:0 0 0 3px var(--ring-gap),0 0 0 5.5px var(--c)}
.sw-more i{background:radial-gradient(circle,var(--c) 0 40%,var(--ring-gap) 42% 50%,transparent 52%),conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#30b0f0,#0a66e8,#af52de,#ff2d78,#ff3b30)}
.sw-more.on i{box-shadow:0 0 0 3px var(--ring-gap),0 0 0 5.5px var(--c)}
.sz{width:36px;height:36px;flex:none;border:0;padding:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--c,var(--ink));transition:transform .4s var(--spring),background .2s,box-shadow .2s}
.sz i{display:block;border-radius:50%;background:currentColor;width:var(--d);height:var(--d)}
.sz.on{background:var(--pill);box-shadow:0 1px 3px rgba(0,0,0,.10),var(--hi)}
.sz:active{transform:scale(.85)}

.r-stage{position:absolute;left:0;right:0;bottom:0;top:var(--stage-top);overflow:hidden;touch-action:none;cursor:crosshair}
.r-paper{position:absolute;inset:0}
.r-paper.turn-n{animation:turnN .34s var(--ease)}
.r-paper.turn-p{animation:turnP .34s var(--ease)}
@keyframes turnN{from{opacity:.15;transform:translateX(42px)}}
@keyframes turnP{from{opacity:.15;transform:translateX(-42px)}}
.r-paper img{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.14),0 14px 44px rgba(20,30,60,.18);pointer-events:none}
.r-paper canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.r-loading{position:absolute;z-index:2;left:50%;top:calc(var(--stage-top) + 40%);transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-1);color:var(--muted);font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);animation:fadeUp .3s var(--ease)}
.r-hint{position:absolute;z-index:2;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(18,24,34,.84);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;pointer-events:none;transition:opacity .5s,transform .5s var(--spring);max-width:calc(100% - 24px);text-align:center;box-shadow:var(--sh-2)}
.r-hint.hide{opacity:0;transform:translate(-50%,12px)}

/* renk paleti */
.r-pop{position:fixed;z-index:6;width:min(340px,calc(100vw - 16px));overflow-y:auto;padding:14px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-2);transform-origin:var(--ax,50%) 0;animation:popIn .4s var(--spring);display:grid;gap:10px;-webkit-user-select:none;user-select:none}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:0 0 0 6px}
.pop-h b{font-size:1rem}
.pop-sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:4px 6px 0}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal .sw{width:100%;height:auto;aspect-ratio:1}
.pal .sw i{width:76%;height:76%}
.sw-add i{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.sw-add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.cp{display:grid;gap:12px;padding:6px 2px 2px;animation:fadeUp .3s var(--ease)}
.cp-sv{position:relative;height:150px;border-radius:16px;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cp-hue{position:relative;height:24px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.knob{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue .knob{top:50%}
.cp-row{display:flex;align-items:center;gap:10px}
.cp-prev{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.cp-hex{font-family:var(--f-mono);font-weight:700;font-size:.9rem;color:var(--muted);flex:1}

/* sayfa önizlemeleri */
.r-sheet{position:absolute;z-index:5;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));top:var(--stage-top);border-radius:26px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--glass-edge);box-shadow:var(--hi),var(--sh-2);display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .5s var(--spring)}
.r-sheet-h{display:flex;align-items:center;gap:12px;padding:12px 12px 10px 20px;border-bottom:1px solid var(--line)}
.r-sheet-h b{font-size:1.05rem}
.r-sheet-h .small{flex:1;min-width:0}
.r-thumbs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 14px;align-content:start}
.r-th{border:0;padding:0;background:none;display:grid;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem;font-weight:600;justify-items:center;transition:transform .4s var(--spring)}
.r-th:active{transform:scale(.94)}
.r-th .im{position:relative;display:block;width:100%;border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px rgba(20,30,60,.12);border:1px solid var(--line);transition:box-shadow .25s}
.r-th .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .4s}
.r-th .im img.on{opacity:1}
.r-th.cur{color:var(--accent)}
.r-th.cur .im{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(20,30,60,.16)}
.r-th .dot{position:absolute;z-index:1;right:5px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--mark);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

</style>
</head>
<body>
<header class="top">
  <div class="wrap"><div class="top-glass">
    <div class="top-row">
    <div class="brand"><div class="dots" aria-hidden="true"><i></i><i class="f"></i><i></i><i></i></div><h1>Deneme Analiz Masası</h1></div>
    <div class="who">
      <label for="stuSel">Öğrenci</label>
      <select id="stuSel"></select>
      <button class="btn" id="addStu" type="button">+ Öğrenci</button>
      <button class="btn ghost" id="logoutBtn" type="button">Çıkış</button>
    </div>
    </div>
    <div id="tabbar"><nav class="tabs" role="tablist" id="tabs" aria-label="Bölümler"></nav></div>
  </div></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<div class="cap" id="cap" role="dialog" aria-modal="true" aria-label="Sayfa çekimi" hidden></div>

      <button class="ib" id="rPrev" type="button" aria-label="Önceki sayfa"></button>
      <input id="rPageNo" class="r-pg" type="number" inputmode="numeric" min="1" aria-label="Sayfa numarası">

        <button class="ib" type="button" data-tool="pen" aria-label="Kalem"></button>
        <button class="ib" type="button" data-tool="hl" aria-label="Fosforlu kalem"></button>

        <button class="sz" type="button" data-size="0" style="--d:5px" aria-label="İnce"><i></i></button>
        <button class="sz" type="button" data-size="1" style="--d:9px" aria-label="Orta"><i></i></button>
        <button class="sz" type="button" data-size="2" style="--d:14px" aria-label="Kalın"><i></i></button>

    <div class="r-sheet-h"><b>Sayfalar</b><span id="rGridNote" class="small muted"></span><button class="ib sm" id="rGridClose" type="button" aria-label="Kapat"></button></div>
    <div class="r-thumbs" id="rThumbs"></div>

</div>


<script>
(function(){
"use strict";
const TABS=[["calis","Çalışmam Gerekenler"],["kitap","Kitaplarım"],["analiz","Yeni analiz"],["gelisim","Gelişim"],["eksik","Eksik konular"],["gecmis","Analizler"],["kagit","Çalışma kağıtları"]];
const S={tab:"calis",open:new Set(),openInit:false,justDone:null,qmap:{},ans:{},students:[],analyses:[],worksheets:[],sid:null,files:[],draft:null,busy:null,ws:null,openAn:null,addingStu:false,sel:{},ready:false,dbOk:null};
let ctl=null,PW="";
try{const t0=localStorage.getItem("da_tab");if(TABS.some(x=>x[0]===t0))S.tab=t0}catch(e){}
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString();
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})}catch(e){return iso}};
const norm=s=>String(s||"").toLocaleLowerCase("tr-TR").replace(/\s+/g," ").trim();
const tkey=q=>norm(q.subject)+"|"+norm(q.topic);
const ST={dogru:"Doğru",yanlis:"Yanlış",bos:"Boş"};
const ET={kavram:"Kavram eksikliği",islem:"İşlem hatası",dikkat:"Okuma/dikkat",bos:"Boş"};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function stu(){return S.students.find(s=>s.id===S.sid)||null}
function mine(arr){return arr.filter(x=>x.studentId===S.sid)}


/* ---------- server ---------- */
try{PW=localStorage.getItem("da_pw")||""}catch(e){}
async function api(path,opt={}){
  let r;
  try{r=await fetch("/api/"+path,{...opt,headers:{...(opt.headers||{}),"x-app-password":PW}})}catch(e){throw{code:"network"}}
  if(r.status===401){logout();throw{code:"auth"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:"server",message:d.error||("Sunucu hatası ("+r.status+")")};
  return d;
}
function logout(){PW="";try{localStorage.removeItem("da_pw")}catch(e){}S.ready=true;S.login=true;S.busy=null;render()}
const byNew=(a,b)=>String(b.createdAt).localeCompare(String(a.createdAt));
async function loadAll(){
  const d=await api("data");
  S.students=(d.students||[]).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  S.analyses=(d.analyses||[]).sort(byNew);S.worksheets=(d.worksheets||[]).sort(byNew);
  if(!S.sid||!stu())S.sid=S.students[0]?.id||null;
}
async function boot(){
  render();
  if(!PW){S.ready=true;S.login=true;renderHeader();render();return}
  try{await loadAll();S.ready=true;S.login=false;S.dbOk=true;S.loadErr=null}
  catch(e){if(e.code!=="auth"){S.ready=true;S.loadErr=e.message||"Sunucuya ulaşılamadı. İnternet bağlantısını kontrol edip sayfayı yenileyin."}}
  renderHeader();render();
}
async function save(col,obj,id){
  const r=await api("doc/"+col+(id?"/"+encodeURIComponent(id):""),{method:id?"PUT":"POST",headers:{"content-type":"application/json"},body:JSON.stringify(obj)});
  const nid=r.id;const arr=S[col];const i=arr.findIndex(x=>x.id===nid);const v={...obj,id:nid};
  if(i>=0)arr[i]=v;else arr.unshift(v);
  renderHeader();if(!S.busy)render();return nid;
}
async function del(col,id){await api("doc/"+col+"/"+encodeURIComponent(id),{method:"DELETE"});S[col]=S[col].filter(x=>x.id!==id);renderHeader();render()}

/* ---------- Claude jobs (run on the server, polled here) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function shrink(file){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){throw{code:"image_rejected"}}
  const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));if(!b)throw{code:"image_rejected"};return b;
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a<b){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw{code:"invalid_json"};
}
async function runJob(prompt,files,signal,onWait){
  const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^A-Za-z0-9]/g,"").slice(0,24);
  for(let i=0;i<files.length;i++){
    if(signal.aborted)throw{code:"cancelled"};
    onWait&&onWait(`Fotoğraf yükleniyor (${i+1}/${files.length})…`);
    const blob=await shrink(files[i]);
    await api(`upload?job=${id}&n=${i}`,{method:"POST",headers:{"content-type":"image/jpeg"},body:blob});
  }
  await api("job",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,prompt,images:files.length})});
  let r;try{r=await fetch("/api-run",{method:"POST",headers:{"content-type":"application/json","x-app-password":PW},body:JSON.stringify({id})})}catch(e){throw{code:"network"}}
  if(!r.ok)throw{code:"server",message:"İşlem başlatılamadı ("+r.status+")."};
  const t0=Date.now();
  for(;;){
    await sleep(4000);
    if(signal.aborted)throw{code:"cancelled"};
    onWait&&onWait(null,Math.round((Date.now()-t0)/1000));
    let j=null;try{j=await api("job/"+id)}catch(e){if(e.code==="auth")throw e}
    if(!j)continue;
    if(j.status==="done"){if(j.stop==="max_tokens")throw{code:"truncated"};return parseJSON(j.text||"")}
    if(j.status==="error")throw{code:"server",message:j.error};
    if(Date.now()-t0>16*60*1000)throw{code:"server",message:"İşlem 15 dakikada bitmedi. Daha az sayfayla tekrar deneyin."};
  }
}

app.addEventListener("input",e=>{
  const el=e.target;if(!S.draft)return;
  if(el.id==="examEdit"){S.draft.examEdit=el.value;return}
  if(el.id==="examDateIn"){S.draft.examDate=el.value;return}
  if(el.dataset.i==null)return;
  const q=S.draft.questions[+el.dataset.i];const f=el.dataset.f;
  if(f==="include")q.include=el.checked;
  else if(f==="student"||f==="correct")q[f]=el.value.toUpperCase().replace(/[^A-E]/g,"")||null;
  else if(f==="topic")q.topic=el.value;
  else if(f==="status"){q.status=el.value;if(el.value==="dogru"){q.include=false;q.error_type=null}else{q.include=true;if(el.value==="bos")q.error_type="bos";else if(!q.error_type||q.error_type==="bos")q.error_type="kavram"}render()}
  if(el.id==="examEdit")S.draft.examEdit=el.value;
});
async function saveDraft(){

/* ---------- topics ---------- */
function topicsAgg(){
  const map=new Map();const st=stu();const resolved=st?.resolved||{};
  mine(S.analyses).slice().reverse().forEach(a=>(a.questions||[]).forEach(q=>{
    if(q.status==="dogru")return;
    const k=tkey(q);let t=map.get(k);
    if(!t){t={key:k,subject:q.subject,unit:q.unit,topic:q.topic,level:q.level,yanlis:0,bos:0,types:{},notes:[],last:a.createdAt,refs:[]};map.set(k,t)}
    t[q.status==="bos"?"bos":"yanlis"]++;if(q.error_type)t.types[q.error_type]=(t.types[q.error_type]||0)+1;
    if(q.diagnosis)t.notes.push(`${a.exam} s.${q.page} soru ${q.no}: ${q.diagnosis}`);
    t.refs.push(`${a.exam} · ${q.no}`);if(String(a.createdAt)>String(t.last))t.last=a.createdAt;t.level=q.level||t.level;
  }));
  return [...map.values()].map(t=>({...t,resolved:!!resolved[t.key]&&String(resolved[t.key])>=String(t.last)})).sort((a,b)=>(a.resolved-b.resolved)||((b.yanlis+b.bos)-(a.yanlis+a.bos))||String(b.last).localeCompare(String(a.last)));
}
async function toggleResolved(key){
  const st=stu();if(!st)return;const r={...(st.resolved||{})};
  const t=topicsAgg().find(x=>x.key===key);
  if(t&&t.resolved)delete r[key];else r[key]=today();
  const {id,...rest}=st;try{await save("students",{...rest,resolved:r},id)}catch(e){toast("Kaydedilemedi.")}
}

/* ---------- worksheet ---------- */
async function makeWorksheet(topics,source,stay){
  const st=stu();if(!st)return;if(!topics.length)return toast("Çalışma kağıdı için en az bir konu seçin.");
  ctl=new AbortController();const sections=[];
  try{
    for(let i=0;i<topics.length;i++){
      const t=topics[i];
      S.busy={label:`Çalışma kağıdı hazırlanıyor: ${t.topic} (${i+1}/${topics.length})… Her konu yaklaşık 1-2 dakika sürer.`};render();
      const base=S.busy.label;
      const r=await runJob(wsPrompt(st,t),[],ctl.signal,(l,sec)=>setBusy(l||`${base} (${sec} sn)`));
      if(!r||!Array.isArray(r.exercises))throw{code:"invalid_json"};
      sections.push({subject:t.subject,unit:t.unit||"",topic:t.topic,level:t.level||"",why:r.why||"",summary:r.summary||[],figures:Array.isArray(r.figures)?r.figures:[],formulas:r.formulas||[],pitfalls:r.pitfalls||[],examples:r.examples||[],exercises:r.exercises||[]});
    }
    const doc={studentId:S.sid,title:`Çalışma Kağıdı – ${source||"Eksik konular"}`,source:source||"",createdAt:today(),sections};
    const id=await save("worksheets",doc);
    if(sections.some(needsFigs))await checkFigures(id,true);
    S.busy=null;if(!stay){S.tab="kagit";S.ws=id;window.scrollTo(0,0)}renderHeader();render();if(stay)openPlayer(id,0);toast("Çalışma kağıdı hazır.");
  }catch(e){
    S.busy=null;render();
    if(sections.length&&e.code!=="cancelled"){toast(errCopy(e)+" Hazırlanan bölümler kaydedildi.");const id=await save("worksheets",{studentId:S.sid,title:`Çalışma Kağıdı – ${source||"Eksik konular"} (eksik)`,source,createdAt:today(),sections}).catch(()=>null);if(id){S.tab="kagit";S.ws=id;renderHeader();render()}}
    else toast(errCopy(e));
  }
}
function draftTopics(qs,exam){
  const map=new Map();
  qs.filter(q=>q.include&&q.status!=="dogru").forEach(q=>{const k=tkey(q);let t=map.get(k);if(!t){t={subject:q.subject,unit:q.unit,topic:q.topic,level:q.level,notes:[]};map.set(k,t)}if(q.diagnosis)t.notes.push(`${exam} s.${q.page} soru ${q.no}: ${q.diagnosis}`)});
  return [...map.values()];
}
function wsBody(w,forFile){
  let n=0;const key=[];
  const secs=w.sections.map(s=>{
    const ex=(s.exercises||[]).map(q=>{n++;key.push({n,topic:s.topic,answer:q.answer,solution:q.solution});return `<div class="q"><div><span class="lvl">${esc(q.level||"")}</span></div>${figHtml(q.figure,q.figureCaption)}<div class="qt"><b>${n}.</b> ${rich(q.question)}</div><div class="opts">${["A","B","C","D","E"].filter(k=>q.options&&q.options[k]!=null).map(k=>`<div class="opt"><span class="bub">${k}</span><span>${optHtml(q.options[k])}</span></div>`).join("")}</div></div>`}).join("");
    return `<section class="ws-sec"><h3>${esc(s.topic)} <small>${esc(s.subject)}${s.level?" · "+esc(s.level):""}</small></h3>
      ${s.why?`<div class="why">${esc(s.why)}</div>`:""}
      ${s.summary?.length?`<div class="box"><h4>Konu özeti</h4><ul>${s.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${(s.figures||[]).map(f=>figHtml(f.svg,f.caption)).join("")}
      ${s.formulas?.length?`<div class="box"><h4>Formüller ve kalıplar</h4><div>${s.formulas.map(x=>`<span class="formula">${esc(x)}</span>`).join("")}</div></div>`:""}
      ${s.pitfalls?.length?`<div class="box"><h4>Sık yapılan hatalar</h4><ul>${s.pitfalls.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${s.examples?.length?`<div class="box"><h4>Çözümlü örnekler</h4><div style="display:grid;gap:14px">${s.examples.map((e,i)=>`<div class="ex">${figHtml(e.figure,e.figureCaption)}<div class="pre"><b>Örnek ${i+1}.</b> ${rich(e.question)}</div><div class="small"><b>Çözüm:</b><ol class="steps">${splitSteps(e).map(x=>`<li class="pre">${rich(x)}</li>`).join("")}</ol>${exAnswer(e)?`<b>Cevap: ${esc(exAnswer(e))}</b>`:""}</div></div>`).join("")}</div></div>`:""}
      <div class="box"><h4>Alıştırmalar</h4><div style="display:grid;gap:18px">${ex}</div></div>
    </section>`}).join("");
  const keyHtml=`<section class="ws-sec" style="${forFile?"break-before:page;":""}"><h3>Cevap anahtarı</h3><div class="tbl-wrap"><table class="key-tbl"><thead><tr><th>Soru</th><th>Cevap</th><th>Kısa çözüm</th></tr></thead><tbody>${key.map(k=>`<tr><td class="num">${k.n}</td><td><span class="bub key">${esc(k.answer)}</span></td><td class="small pre">${esc(k.solution||"")}</td></tr>`).join("")}</tbody></table></div></section>`;
  return {secs,keyHtml,count:n};
}
function wsFileHtml(w,st){

function cleanSvg(src){
  if(!src||typeof src!=="string")return "";
  if(svgMemo.has(src))return svgMemo.get(src);
  let out="";
  try{
    const i=src.search(/<svg[\s>]/i);
    if(i>=0){
      let txt=src.slice(i);const end=txt.lastIndexOf("</svg>");if(end>0)txt=txt.slice(0,end+6);
      if(!/^<svg[^>]*\sxmlns\s*=/i.test(txt))txt=txt.replace(/^<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
      const doc=new DOMParser().parseFromString(txt,"image/svg+xml"),root=doc.documentElement;
      if(root&&root.nodeName.toLowerCase()==="svg"&&!doc.getElementsByTagName("parsererror").length){
        const walk=el=>{
          [...el.children].forEach(c=>{if(!SVG_OK.has(c.nodeName))c.remove();else walk(c)});
          [...el.attributes].forEach(at=>{const n=at.name.toLowerCase(),v=at.value.trim(),lv=v.toLowerCase();
            if(n.startsWith("on")||/javascript:|data:/i.test(v)||n==="class"||((n==="href"||n==="xlink:href")&&!v.startsWith("#"))||(n==="style"&&/url\(\s*['"]?(?!#)/i.test(v))){el.removeAttribute(at.name);return}
            if(n==="fill"||n==="stroke"){
              if(/^(#000(000)?|black)$/.test(lv))el.setAttribute(n,"currentColor");
              else if(/^(#fff(fff)?|white)$/.test(lv)){el.removeAttribute(at.name);addStyle(el,n,"var(--surface)")}
              else if(SVG_TOK[lv]){el.removeAttribute(at.name);addStyle(el,n,SVG_TOK[lv])}
            }});
        };
        walk(root);
        if(!root.getAttribute("viewBox")){const w=parseFloat(root.getAttribute("width")),h=parseFloat(root.getAttribute("height"));if(w&&h)root.setAttribute("viewBox",`0 0 ${w} ${h}`)}
        root.removeAttribute("width");root.removeAttribute("height");root.setAttribute("role","img");

  svgMemo.set(src,out);return out;
}

const GROUPS=[["intro","Konu özeti"],["formulas","Formüller ve kalıplar"],["pitfalls","Sık yapılan hatalar"],["example","Çözümlü örnekler"],["ex","Alıştırmalar"],["result","Sonuç"]];
function treeHtml(w,steps,pos){
  const cur=steps[pos];

    const items=GROUPS.map(([k,l])=>{
      const idx=[];steps.forEach((x,i)=>{if(x.si===si&&x.k===k)idx.push([x,i])});if(!idx.length)return "";
      const done=idx.filter(([x])=>isDone(w,x)).length,all=idx.length,active=cur.si===si&&cur.k===k;
      const okN=k==="ex"?idx.filter(([x])=>S.ans[qidOf(w,si,x.i)]===s.exercises[x.i].answer).length:0;
      const meta=k==="ex"?`${done}/${all}${done?` · ${okN} D`:""}`:(all>1?`${done}/${all}`:"");
      return `<button type="button" class="tr-i${active?" act":""}${done===all?" ok":""}" data-pl="go" data-pos="${idx[0][1]}"${active?' aria-current="step"':""}><span class="tr-dot">${done===all?"✓":""}</span><span class="tr-l">${l}</span>${meta?`<span class="tr-m">${meta}</span>`:""}</button>`;
    }).join("");
    return `<div class="tr-sec${cur.si===si?" cur":""}"><div class="tr-h"><span class="tr-n">${si+1}</span><span><b>${esc(s.topic)}</b><span class="small muted">${esc(s.subject)}${s.level?" · "+esc(s.level):""}</span></span></div>${items}</div>`;
  }).join("");
}

  }

    ${redo?`<div><button type="button" class="btn" data-pl="redo">Yanlış ve boşları tekrar çöz (${redo})</button></div>`:""}
    ${t?(t.resolved?`<div><span class="pill p-dogru">✓ Bu konu tamamlandı</span></div>`:`<div class="done-row"><button type="button" class="btn done-btn" data-pl="done">✓ Konuyu tamamladım</button><span class="small muted">Konuyu anladıysan işaretle; "Çalışmam Gerekenler" listende yeşil tikle görünür.</span></div>`):""}`;

function navHtml(w,steps,st){
  const P=S.play,last=P.pos===steps.length-1;let label="Sonraki ›",act="next";
  if(st.k==="example"){const n=splitSteps(w.sections[st.si].examples[st.i]).length;if((P.rev[stepKey(w,st)]||0)<n){label=(P.rev[stepKey(w,st)]||0)?"Sonraki adım":"Çözümü başlat";act="reveal"}}
  if(act==="next"){
    if(st.k==="ex"&&!S.ans[qidOf(w,st.si,st.i)])label="Atla ›";
    if(st.k==="result"&&!last)label="Sonraki konu ›";
    if(last){label="Bitir";act="close"}
  }
  return `<button type="button" class="btn" data-pl="prev" ${P.pos===0?"disabled":""}>‹ Önceki</button><span class="pl-pos small muted">${P.pos+1} / ${steps.length}</span><button type="button" class="btn pl-next" data-pl="${act}">${label}</button>`;
}
function renderPlay(){

  const steps=playSteps(w);P.pos=Math.max(0,Math.min(steps.length-1,P.pos));const st=steps[P.pos],s=w.sections[st.si];

      <div class="pl-stage"><div class="pl-card${P.dir>0?" in-r":P.dir<0?" in-l":""}">${stepHtml(w,st,s)}</div></div></div>

function setTree(on){if(!S.play)return;S.play.tree=on;playEl.querySelector(".pl-tree")?.classList.toggle("on",on);playEl.querySelector(".pl-back")?.classList.toggle("on",on);playEl.querySelector(".pl-treebtn")?.setAttribute("aria-expanded",on)}
playEl.addEventListener("click",async e=>{
  const b=e.target.closest("[data-pl]");if(!b||!S.play)return;
  const P=S.play,a=b.dataset.pl,w=S.worksheets.find(x=>x.id===P.wsId);if(!w)return closePlayer();
  const steps=playSteps(w),st=steps[P.pos];
  const go=p=>{p=Math.max(0,Math.min(steps.length-1,p));P.dir=p>P.pos?1:p<P.pos?-1:0;P.pos=p;P.tree=false;renderPlay()};

  if(a==="stop"){ctl?.abort();return}
  if(a==="figs"){P.tree=false;checkFigures(P.wsId);return}
  if(a==="tree")return setTree(!P.tree);
  if(a==="go")return go(+b.dataset.pos);
  if(a==="prev")return go(P.pos-1);
  if(a==="next")return go(P.pos+1);
  if(a==="goq")return go(steps.findIndex(x=>x.si===st.si&&x.k==="ex"&&x.i===+b.dataset.q));

  if(a==="pick"&&qid){S.ans[qid]=b.dataset.o;saveAns();renderPlay();playEl.querySelector(".fb")?.scrollIntoView({block:"nearest"});return}
  if(a==="retry"&&qid){delete S.ans[qid];saveAns();renderPlay();return}
  if(a==="hint"&&qid){P.hint[qid]=1;renderPlay();return}
  if(a==="redo"){const s=w.sections[st.si];let first=null;(s.exercises||[]).forEach((x,i)=>{const id=qidOf(w,st.si,i);if(S.ans[id]!==x.answer){delete S.ans[id];if(first==null)first=i}});saveAns();if(first!=null)go(steps.findIndex(x=>x.si===st.si&&x.k==="ex"&&x.i===first));return}
  if(a==="done"){const key=tkey(w.sections[st.si]);const t=topicsAgg().find(x=>x.key===key);if(t&&!t.resolved){await toggleResolved(key);toast("Harika! Konu tamamlandı.")}renderPlay();return}
});
document.addEventListener("keydown",e=>{
  if(!S.play||playEl.hidden)return;
  if(e.key==="Escape"){if(S.play.tree)setTree(false);else closePlayer();return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||""))return;
  if(e.key==="ArrowRight"){e.preventDefault();playEl.querySelector(".pl-next")?.click()}
  if(e.key==="ArrowLeft"){e.preventDefault();const p=playEl.querySelector('[data-pl="prev"]');if(p&&!p.disabled)p.click()}
});

const STORES=["pages","strokes","meta","thumbs"];
const mem={pages:new Map(),strokes:new Map(),meta:new Map(),thumbs:new Map()};
let dbP=null;
function db(){
  return dbP||(dbP=new Promise(res=>{
    try{
      const r=indexedDB.open("cizim",2);
      r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)})};
      r.onsuccess=()=>res(r.result);
      r.onerror=r.onblocked=()=>res(null);
    }catch(e){res(null)}
  }));
}
async function idbGet(store,k){
  const d=await db();if(!d)return mem[store].get(k);
  return new Promise(res=>{try{const q=d.transaction(store).objectStore(store).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(mem[store].get(k))}catch(e){res(mem[store].get(k))}});
}
async function idbPut(store,k,v){
  if(store==="strokes"||store==="meta")mem[store].set(k,v);
  const d=await db();if(!d){mem[store].set(k,v);return false}
  return new Promise(res=>{try{const tx=d.transaction(store,"readwrite");tx.objectStore(store).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}});
}
async function idbEach(store,prefix,fn){
  const d=await db();
  if(!d){mem[store].forEach((v,k)=>{if(String(k).startsWith(prefix))fn(k,v)});return}
  return new Promise(res=>{try{
    const q=d.transaction(store).objectStore(store).openCursor(IDBKeyRange.bound(prefix,prefix+"￿"));
    q.onsuccess=()=>{const c=q.result;if(!c)return res();fn(c.key,c.value);c.continue()};q.onerror=()=>res();
  }catch(e){res()}});
}

/* ---------- sayfa görselleri: IndexedDB -> sunucu ---------- */
function b64ToBuffer(b64){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8.buffer}
const pagePend=new Map();
function getPageRec(bookId,n){
  const k=bookId+"/"+n;if(pagePend.has(k))return pagePend.get(k);
  const p=(async()=>{
    let rec=await idbGet("pages",k);
    if(!rec){const j=await api({action:"page",book:bookId,n});rec={b:b64ToBuffer(j.data),type:j.type||"image/jpeg"};await idbPut("pages",k,rec)}
    return rec;
  })();
  pagePend.set(k,p);p.then(()=>pagePend.delete(k),()=>pagePend.delete(k));return p;
}
const urls=new Map();
async function pageUrl(bookId,n){
  const k=bookId+"/"+n;
  if(urls.has(k)){const u=urls.get(k);urls.delete(k);urls.set(k,u);return u}
  const rec=await getPageRec(bookId,n);
  if(urls.has(k))return urls.get(k);
  const u=URL.createObjectURL(new Blob([rec.b],{type:rec.type}));urls.set(k,u);
  while(urls.size>8){const old=urls.keys().next().value;if(R.book&&old===R.book.id+"/"+R.page&&urls.size>1){const cu=urls.get(old);urls.delete(old);urls.set(old,cu);continue}URL.revokeObjectURL(urls.get(old));urls.delete(old)}
  return u;
}

/* ---------- küçük resimler (kapaklar ve sayfa önizlemeleri) ---------- */
const nq=[];let nqActive=0,gridToken=0;
function netQueue(fn,tok){return new Promise((res,rej)=>{nq.push({fn,tok,res,rej});pump()})}
function pump(){
  while(nqActive<2&&nq.length){
    const t=nq.shift();
    if(t.tok!=null&&t.tok!==gridToken){t.rej(new Error("cancel"));continue}
    nqActive++;Promise.resolve().then(t.fn).then(t.res,t.rej).then(()=>{nqActive--;pump()});
  }
}
let tchain=Promise.resolve();
function thumbChain(fn){const p=tchain.then(fn);tchain=p.catch(()=>{});return p}
async function makeThumb(rec){
  const blob=new Blob([rec.b],{type:rec.type});
  let src,w,h,done=()=>{};
  try{const bmp=await createImageBitmap(blob);src=bmp;w=bmp.width;h=bmp.height;done=()=>{try{bmp.close()}catch(e){}}}
  catch(e){const u=URL.createObjectURL(blob),im=new Image();im.src=u;await im.decode();src=im;w=im.naturalWidth;h=im.naturalHeight;done=()=>URL.revokeObjectURL(u)}
  const W=300,H=Math.max(1,Math.round(W*h/w)),c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);done();
  const out=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));c.width=c.height=0;
  return out?{b:await out.arrayBuffer()}:null;
}
const thumbUrls=new Map(),thumbPend=new Map();
function thumbUrl(bookId,n,tok){
  const k=bookId+"/"+n;
  if(thumbUrls.has(k))return Promise.resolve(thumbUrls.get(k));
  if(thumbPend.has(k))return thumbPend.get(k);
  const p=(async()=>{
    let t=await idbGet("thumbs",k);
    if(!t){const rec=await netQueue(()=>getPageRec(bookId,n),tok);t=await thumbChain(()=>makeThumb(rec));if(!t)throw new Error("thumb");idbPut("thumbs",k,t)}
    const u=URL.createObjectURL(new Blob([t.b],{type:"image/jpeg"}));thumbUrls.set(k,u);return u;
  })();
  thumbPend.set(k,p);p.then(()=>thumbPend.delete(k),()=>thumbPend.delete(k));return p;
}

/* ---------- kitaplık ---------- */
function loginHtml(){
  return `<section class="panel" style="max-width:440px;width:100%;margin:24px auto;display:grid;gap:14px">
    <div><div class="eyebrow">Kitaplarım</div><h2 style="margin-top:4px">Kitaplık şifresi</h2><p class="small muted" style="margin:6px 0 0">Drive'daki kitaplarına ulaşmak için öğrenci şifreni bir kez gir.</p></div>
    <form id="bkLogin" style="display:grid;gap:10px"><input type="password" id="bkKey" autocomplete="current-password" placeholder="Şifre" required>${B.loginErr?`<div class="small" style="color:var(--bad)">${esc(B.loginErr)}</div>`:""}<button class="btn pri" type="submit" ${B.logging?"disabled":""}>${B.logging?"Bağlanılıyor…":"Giriş yap"}</button></form></section>`;
}
function view(){
  if(!B.key)return loginHtml();
  const list=B.books,n=list?list.length:0;
  const sub=B.note||(list?"Bir kitaba dokun, kaldığın sayfadan devam et. Çözümlerin otomatik kaydedilir.":"Drive'daki kitapların getiriliyor.");
  const head=`<section class="panel bk-head"><div style="min-width:0;flex:1"><div class="eyebrow">Kitaplarım</div><h2 style="margin-top:4px">${list?(n?n+" kitap":"Henüz hazır kitap yok"):"Kitaplar yükleniyor…"}</h2><p class="small muted" style="margin:4px 0 0">${esc(sub)}</p></div>${B.note&&!B.loading?`<button class="btn" type="button" data-bk="retry">Yenile</button>`:""}</section>`;
  if(!list)return head+`<div class="bk-grid">${Array.from({length:6},(_,i)=>`<div class="bk-card is-skel" style="--i:${i}" aria-hidden="true"><span class="bk-cover skel"></span><span class="bk-info"><span class="skel-line skel"></span><span class="skel-line short skel"></span></span></div>`).join("")}</div>`;
  if(!n)return head;
  return head+`<div class="bk-grid">${list.map((b,i)=>{
    const last=B.last[b.id],pct=last&&b.pages?Math.max(3,last/b.pages*100):0,cv=B.covers.get(b.id);
    return `<button type="button" class="bk-card" data-bk="open" data-id="${esc(b.id)}" style="--i:${i}" aria-label="${esc(b.name)}, ${b.pages} sayfa${last?`, ${last}. sayfada kaldın`:""}">
      <span class="bk-cover" style="aspect-ratio:${b.w&&b.h?b.w+"/"+b.h:"1/1.414"}">${cv?"":`<span class="bk-ph skel"></span>`}<img alt="" data-cover="${esc(b.id)}"${cv?` src="${cv}" class="on"`:""}></span>
      <span class="bk-info"><span class="bk-name">${esc(b.name)}</span><span class="small muted">${b.pages} sayfa${last?` · ${last}. sayfada`:""}</span>${pct?`<span class="bar"><i style="width:${pct}%"></i></span>`:""}</span></button>`;
  }).join("")}</div>`;
}
function mount(){
  if(!B.key||B.logging)return;
  if(!B.lastLoaded)loadLast();
  if(!B.loaded&&!B.loading)loadBooks();
  (B.books||[]).forEach(cover);
}
function cover(b){
  if(B.covers.has(b.id)||B.coverTried.has(b.id))return;
  B.coverTried.add(b.id);
  thumbUrl(b.id,1,null).then(u=>{
    B.covers.set(b.id,u);
    const im=document.querySelector(`img[data-cover="${CSS.escape(b.id)}"]`);
    if(im&&!im.getAttribute("src")){im.onload=()=>{im.classList.add("on");const ph=im.parentNode.querySelector(".bk-ph");if(ph)setTimeout(()=>ph.remove(),500)};im.src=u}
  }).catch(()=>{});
}
async function loadLast(){
  B.lastLoaded=true;let any=false;
  await idbEach("meta","last/",(k,v)=>{const id=String(k).slice(5);if(!B.last[id]){B.last[id]=v;any=true}});
  if(any)rerender();
}
async function loadBooks(){
  if(B.loading)return;B.loading=true;
  if(!B.books){const c=await idbGet("meta","books");if(c){B.books=c;rerender()}}
  try{const j=await api({action:"books"});B.books=j.books||[];B.note="";idbPut("meta","books",B.books)}
  catch(e){
    B.loading=false;
    if(e.code==="auth")return logoutBooks("Şifre değişmiş görünüyor. Yeniden gir.");
    B.note=B.books?"İnternete bağlanılamadı: daha önce açtığın sayfalar yine kullanılabilir.":"Kitap listesi alınamadı. İnternet bağlantını kontrol et.";
  }
  B.loading=false;B.loaded=true;rerender();
}
function logoutBooks(msg){
  if(R.open)closeReader(true);
  B.key="";pref("key",null);B.books=null;B.loaded=false;B.loginErr=msg||"";rerender(true);
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="bkLogin")return;e.preventDefault();
  const k=g("bkKey").value.trim();if(!k)return;
  B.key=k;B.logging=true;B.loginErr="";render();
  try{await api({action:"login"});pref("key",k);B.logging=false;B.loaded=false;B.books=null;render()}
  catch(er){B.key="";B.logging=false;B.loginErr=er.code==="auth"?"Şifre yanlış.":"Bağlanılamadı. İnternetini kontrol et.";render()}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-bk]");if(!b)return;
  const a=b.dataset.bk;
  if(a==="open"){const bk=(B.books||[]).find(x=>x.id===b.dataset.id);if(bk)openBook(bk,b);return}
  if(a==="retry"){B.loaded=false;B.note="";B.coverTried.clear();rerender(true);return}
});

const SIZES=[0.0016,0.003,0.0055];
