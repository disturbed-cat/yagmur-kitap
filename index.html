/* ---------- Drive yedeği ---------- */
const dirty=new Set();let syncing=false,syncTimer=0,localOk=true;
function setStatus(){
  const s=g("rStatus");
  s.textContent=!localOk?"Bu cihaza kaydedilemiyor":dirty.size?"Kaydedildi · Drive yedeği bekliyor":"Kaydedildi · Drive'a yedeklendi";
  s.classList.toggle("warn",!localOk);
}
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms||2500)}
async function syncNow(){
  if(syncing||!B.key||!dirty.size)return;
  syncing=true;
  for(const k of Array.from(dirty)){
    const rec=await idbGet("strokes",k);
    if(!rec||!rec.d){dirty.delete(k);continue}
    const cut=k.lastIndexOf("/");
    try{await api({action:"saveDrawing",book:k.slice(0,cut),n:+k.slice(cut+1),data:JSON.stringify(rec.s),t:rec.t})}catch(e){break}
    const now=await idbGet("strokes",k);
    if(now&&now.t===rec.t){now.d=0;await idbPut("strokes",k,now);dirty.delete(k);if(R.book&&k===R.book.id+"/"+R.page&&curT===rec.t)curDirty=false}
  }
  syncing=false;if(R.open)setStatus();
  if(dirty.size)scheduleSync(30000);
}
window.addEventListener("online",()=>scheduleSync(500));
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(syncTimer);syncNow()}});
function saveStrokes(){
  if(!R.book)return;
  const k=R.book.id+"/"+R.page;curT=Date.now();curDirty=true;dirty.add(k);setStatus();
  idbPut("strokes",k,{s:strokes.slice(),t:curT,d:1}).then(ok=>{localOk=ok;setStatus()});
  scheduleSync();
}

/* ---------- görünüm ---------- */
function placeStage(){
  const r=g("rBar").getBoundingClientRect();
  rd.style.setProperty("--stage-top",Math.round(r.bottom+8)+"px");
  measure();clampView();requestRender();
}
function measure(){
  const r=stage.getBoundingClientRect();
  rect={left:r.left,top:r.top,width:r.width||1,height:r.height||1};
  dpr=Math.min(window.devicePixelRatio||1,3);
  const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);
  [ink,live].forEach(c=>{if(c.width!==w||c.height!==h){c.width=w;c.height=h}});
  fitK=Math.max(100,Math.min(rect.width-24,1100));
}
function fitView(){view_.k=fitK;view_.x=(rect.width-fitK)/2;view_.y=12;clampView();requestRender()}
function clampView(){
  const minK=Math.min(fitK,(rect.height-24)/aspect)*0.8,maxK=fitK*6;
  view_.k=Math.max(minK,Math.min(maxK,view_.k));
  const pw=view_.k,ph=view_.k*aspect,m=12;
  view_.x=pw+2*m<=rect.width?(rect.width-pw)/2:Math.max(rect.width-pw-m,Math.min(m,view_.x));
  view_.y=ph+2*m<=rect.height?(rect.height-ph)/2:Math.max(rect.height-ph-m,Math.min(m,view_.y));
}

/* ---------- çizim ---------- */
function setTx(ctx){ctx.setTransform(dpr*view_.k,0,0,dpr*view_.k,dpr*view_.x,dpr*view_.y)}
function clearCtx(ctx,c){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height)}
function drawStroke(ctx,s){
  const p=s.p,n=p.length/3;if(!n)return;
  ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=ctx.fillStyle=s.c;
  if(s.t==="hl"){
    ctx.globalAlpha=0.35;ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(p[0],p[1]);
    if(n===1)ctx.lineTo(p[0]+1e-5,p[1]);
    for(let i=1;i<n-1;i++)ctx.quadraticCurveTo(p[3*i],p[3*i+1],(p[3*i]+p[3*i+3])/2,(p[3*i+1]+p[3*i+4])/2);
    if(n>1)ctx.lineTo(p[3*n-3],p[3*n-2]);
    ctx.stroke();ctx.globalAlpha=1;return;
  }
  const wf=i=>s.w*(0.55+0.9*p[3*i+2]);
  if(n===1){ctx.beginPath();ctx.arc(p[0],p[1],wf(0)/2,0,6.2832);ctx.fill();return}
  let ax=p[0],ay=p[1];
  for(let i=1;i<n-1;i++){
    const mx=(p[3*i]+p[3*i+3])/2,my=(p[3*i+1]+p[3*i+4])/2;
    ctx.lineWidth=wf(i);ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(p[3*i],p[3*i+1],mx,my);ctx.stroke();ax=mx;ay=my;
  }
  ctx.lineWidth=wf(n-1);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(p[3*n-3],p[3*n-2]);ctx.stroke();
}
let renderQ=false,liveQ=false;
function requestRender(){
  if(renderQ)return;renderQ=true;
  requestAnimationFrame(()=>{
    renderQ=false;
    img.style.width=view_.k+"px";img.style.height=view_.k*aspect+"px";img.style.transform=`translate(${view_.x}px,${view_.y}px)`;
    clearCtx(ictx,ink);setTx(ictx);for(let i=0;i<strokes.length;i++)drawStroke(ictx,strokes[i]);
    renderLive();
  });
}
function requestLive(){if(liveQ)return;liveQ=true;requestAnimationFrame(()=>{liveQ=false;renderLive()})}
function renderLive(){clearCtx(lctx,live);if(draw&&draw.stroke){setTx(lctx);drawStroke(lctx,draw.stroke)}}

function segDist2(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));const qx=ax+t*dx-px,qy=ay+t*dy-py;return qx*qx+qy*qy}
function hits(s,x,y,r){
  const p=s.p,n=p.length/3,rr=(r+s.w/2)*(r+s.w/2);
  if(n===1)return segDist2(x,y,p[0],p[1],p[0],p[1])<=rr;
  for(let i=1;i<n;i++)if(segDist2(x,y,p[3*i-3],p[3*i-2],p[3*i],p[3*i+1])<=rr)return true;
  return false;
}
function commit(before){undoStack.push({before,after:strokes.slice()});if(undoStack.length>200)undoStack.shift();redoStack.length=0;saveStrokes();syncTools()}
function undo(){const a=undoStack.pop();if(!a)return;redoStack.push(a);strokes=a.before.slice();saveStrokes();syncTools();requestRender()}
function redo(){const a=redoStack.pop();if(!a)return;undoStack.push(a);strokes=a.after.slice();saveStrokes();syncTools();requestRender()}
const lum=h=>{const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);return .2126*v[0]+.7152*v[1]+.0722*v[2]};

/* ---------- kalem / parmak girişi ---------- */
const touches=new Map();let draw=null,gesture=null,lastPen=-1e9;
const pos=e=>({x:e.clientX-rect.left,y:e.clientY-rect.top});
function activeTouches(){const a=[];touches.forEach(t=>{if(!t.ignored)a.push(t)});return a}
function startGesture(){
  const pts=activeTouches();if(!pts.length){gesture=null;return}
  let cx=0,cy=0;pts.forEach(t=>{cx+=t.x;cy+=t.y});cx/=pts.length;cy/=pts.length;
  const d=pts.length>=2?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0;
  gesture={cx,cy,d,n:pts.length,v:{k:view_.k,x:view_.x,y:view_.y}};
}
function moveGesture(){
  const pts=activeTouches();if(!gesture||pts.length!==gesture.n)return startGesture();
  let cx=0,cy=0;pts.forEach(t=>{cx+=t.x;cy+=t.y});cx/=pts.length;cy/=pts.length;
  const gv=gesture.v,px=(gesture.cx-gv.x)/gv.k,py=(gesture.cy-gv.y)/gv.k;let k=gv.k;
  if(gesture.d>0)k=gv.k*Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/gesture.d;
  view_.k=k;clampView();view_.x=cx-px*view_.k;view_.y=cy-py*view_.k;clampView();requestRender();
}
function beginDraw(e){
  const before=strokes.slice();
  if(tool==="eraser")draw={id:e.pointerId,type:e.pointerType,erase:true,changed:false,before};
  else{const hl=tool==="hl";draw={id:e.pointerId,type:e.pointerType,before,stroke:{t:hl?"hl":"pen",c:hl&&lum(color)<.2?"#ffd60a":color,w:SIZES[size]*(hl?7:1),p:[]}}}
  addPoint(e);g("rHint").classList.add("hide");
}
function addPoint(e){
  const x=(e.clientX-rect.left-view_.x)/view_.k,y=(e.clientY-rect.top-view_.y)/view_.k;
  if(draw.erase){const r=14/view_.k,keep=strokes.filter(s=>!hits(s,x,y,r));if(keep.length!==strokes.length){strokes=keep;draw.changed=true;requestRender()}return}
  const p=draw.stroke.p,n=p.length;if(n&&p[n-3]===x&&p[n-2]===y)return;
  p.push(x,y,draw.type==="pen"?(e.pressure||0.5):0.5);requestLive();
}
function endDraw(){
  const d=draw;draw=null;
  if(d.erase){if(d.changed)commit(d.before);return}
  const p=d.stroke.p;
  if(p.length>=3){for(let i=0;i<p.length;i++)p[i]=i%3===2?Math.round(p[i]*100)/100:Math.round(p[i]*1e5)/1e5;strokes.push(d.stroke);commit(d.before)}
  requestRender();
}
function cancelDraw(){if(draw&&draw.erase&&draw.changed)strokes=draw.before;draw=null;requestRender()}

stage.addEventListener("pointerdown",e=>{
  e.preventDefault();const pt=e.pointerType;
  try{stage.setPointerCapture(e.pointerId)}catch(err){}
  if(pt==="touch"){
    const ignored=!finger&&((draw&&draw.type==="pen")||performance.now()-lastPen<400);
    const t=pos(e);t.ignored=ignored;touches.set(e.pointerId,t);if(ignored)return;
    if(finger){if(draw&&draw.type==="touch"){cancelDraw();startGesture();return}if(!draw&&activeTouches().length===1){beginDraw(e);return}if(draw)return}
    startGesture();return;
  }
  if(pt==="mouse"&&e.button!==0)return;
  if(draw){if(draw.type==="touch"&&pt==="pen")cancelDraw();else return}
  if(pt==="pen"){lastPen=performance.now();gesture=null;touches.forEach(t=>{t.ignored=true})}
  beginDraw(e);
});
stage.addEventListener("pointermove",e=>{
  if(draw&&e.pointerId===draw.id){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(evs.length)evs.forEach(addPoint);else addPoint(e);if(e.pointerType==="pen")lastPen=performance.now();return}
  if(e.pointerType!=="touch")return;
  const t=touches.get(e.pointerId);if(!t)return;const p=pos(e);t.x=p.x;t.y=p.y;if(t.ignored||draw)return;moveGesture();
});
function pointerEnd(e){
  if(draw&&e.pointerId===draw.id){if(e.pointerType==="pen")lastPen=performance.now();endDraw()}
  if(touches.delete(e.pointerId))startGesture();
}
stage.addEventListener("pointerup",pointerEnd);
stage.addEventListener("pointercancel",pointerEnd);
stage.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
stage.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>{if(R.open)e.preventDefault()});
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){const p=pos(e),px=(p.x-view_.x)/view_.k,py=(p.y-view_.y)/view_.k;view_.k*=Math.exp(-e.deltaY*0.01);clampView();view_.x=p.x-px*view_.k;view_.y=p.y-py*view_.k}
  else{view_.x-=e.deltaX;view_.y-=e.deltaY}
  clampView();requestRender();
},{passive:false});

/* ---------- sayfa geçişi ---------- */
let loadToken=0,loadTimer=0;
function showLoading(text,canRetry){
  clearTimeout(loadTimer);
  const set=()=>{g("rLoading").hidden=!text;g("rLoadText").textContent=text||"";g("rRetry").hidden=!canRetry;g("rLoading").querySelector(".spin").hidden=!!canRetry};
  if(text&&!canRetry)loadTimer=setTimeout(set,180);else set();
}
function turn(dir){if(!dir||reduced())return;paper.classList.remove("turn-n","turn-p");void paper.offsetWidth;paper.classList.add(dir>0?"turn-n":"turn-p")}
function prefetch(n){const b=R.book;if(b&&n>=1&&n<=b.pages)getPageRec(b.id,n).catch(()=>{})}
async function goPage(n){
  const b=R.book;if(!b)return;
  if(draw)cancelDraw();
  n=Math.max(1,Math.min(b.pages,parseInt(n,10)||1));
  const dir=R.page?Math.sign(n-R.page):0;R.page=n;
  const token=++loadToken,k=b.id+"/"+n;
  strokes=[];undoStack=[];redoStack=[];curT=0;curDirty=false;
  B.last[b.id]=n;idbPut("meta","last/"+b.id,n);
  g("rPageNo").value=n;syncTools();
  img.style.visibility="hidden";showLoading("Sayfa yükleniyor…");requestRender();
  idbGet("strokes",k).then(rec=>{
    if(token!==loadToken||undoStack.length)return;
    if(rec){strokes=rec.s.slice();curT=rec.t;curDirty=!!rec.d}
    syncTools();requestRender();checkRemote();
  });
  try{
    const u=await pageUrl(b.id,n);if(token!==loadToken)return;
    img.onload=()=>{
      if(token!==loadToken)return;
      aspect=img.naturalHeight/img.naturalWidth||aspect;img.style.visibility="";showLoading("");fitView();turn(dir);
      prefetch(n+1);prefetch(n+2);prefetch(n-1);
    };
    img.onerror=()=>{if(token===loadToken)showLoading("Sayfa görseli açılamadı.",true)};
    img.src=u;
  }catch(e){
    if(token!==loadToken)return;
    if(e.code==="auth")return logoutBooks("Şifre değişmiş görünüyor. Yeniden gir.");
    showLoading(navigator.onLine===false||e.code==="network"?"Bu sayfa henüz indirilmemiş ve internet yok.":"Sayfa yüklenemedi: "+e.message,true);
  }
}
async function checkRemote(){
  const token=loadToken,n=R.page,b=R.book;
  if(!b||!remoteIdx||!remoteIdx[n]||remoteIdx[n]<=curT||curDirty)return;
  try{
    const j=await api({action:"drawing",book:b.id,n});
    if(token!==loadToken||!j.data||curDirty||undoStack.length)return;
    strokes=JSON.parse(j.data);curT=j.t||remoteIdx[n];
    await idbPut("strokes",b.id+"/"+n,{s:strokes.slice(),t:curT,d:0});syncTools();requestRender();
  }catch(e){}
}

/* ---------- açılış / kapanış ---------- */
const insetOf=r=>`inset(${Math.max(0,r.top)}px ${Math.max(0,innerWidth-r.right)}px ${Math.max(0,innerHeight-r.bottom)}px ${Math.max(0,r.left)}px round 12px)`;
async function openBook(b,el){
  if(R.open)return;
  R.open=true;R.closing=false;R.book=b;R.page=0;remoteIdx=null;if(b.w&&b.h)aspect=b.h/b.w;
  g("rTitle").textContent=b.name;g("rTitle").title=b.name;g("rCount").textContent="/ "+b.pages;g("rPageNo").max=b.pages;
  strokes=[];clearCtx(ictx,ink);clearCtx(lctx,live);img.style.visibility="hidden";
  rd.hidden=false;document.documentElement.style.overflow="hidden";
  placeStage();setStatus();syncTools();
  const cv=el&&el.querySelector(".bk-cover");
  if(!reduced()&&rd.animate){
    if(cv)rd.animate([{clipPath:insetOf(cv.getBoundingClientRect())},{clipPath:"inset(0px 0px 0px 0px round 0px)"}],{duration:560,easing:"cubic-bezier(.2,.9,.2,1)"});
    else rd.animate([{opacity:0,transform:"scale(.98)"},{opacity:1,transform:"none"}],{duration:320,easing:"ease-out"});
  }
  if(!pref("hintSeen")){const h=g("rHint");h.classList.remove("hide");pref("hintSeen","1");setTimeout(()=>h.classList.add("hide"),6000)}
  const last=B.last[b.id]||await idbGet("meta","last/"+b.id)||1;
  if(R.book!==b)return;
  goPage(last);
  try{const j=await api({action:"drawingIndex",book:b.id});if(R.book===b){remoteIdx=j.pages||{};checkRemote()}}catch(e){}
}
function closeReader(instant){
  if(!R.open||R.closing)return;
  if(draw)cancelDraw();closePop();closeGrid();clearTimeout(syncTimer);syncNow();
  R.closing=true;const id=R.book&&R.book.id;
  const fin=()=>{rd.hidden=true;R.open=false;R.closing=false;R.book=null;R.page=0;loadToken++;showLoading("");img.removeAttribute("src");document.documentElement.style.overflow=""};
  rerender(true);
  if(instant||reduced()||!rd.animate)return fin();
  const card=id&&document.querySelector(`.bk-card[data-id="${CSS.escape(id)}"] .bk-cover`);
  let kf=null;
  if(card){const r=card.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)kf=[{clipPath:"inset(0px 0px 0px 0px round 0px)"},{clipPath:insetOf(r)}]}
  const a=rd.animate(kf||[{opacity:1,transform:"none"},{opacity:0,transform:"scale(.98)"}],{duration:kf?420:240,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
  a.onfinish=()=>{fin();a.cancel()};
}

/* ---------- araç çubuğu ---------- */
let quickSig="";
function renderQuick(){
  const sig=quick.join(",");
  if(sig!==quickSig){
    quickSig=sig;
    g("rColors").innerHTML=quick.map(c=>`<button type="button" class="sw" data-c="${c}" style="--c:${c}" aria-label="${colorName(c)}"><i></i></button>`).join("")+
      `<button type="button" class="sw sw-more" id="rMore" aria-label="Tüm renkler" aria-haspopup="dialog" aria-expanded="false"><i></i></button>`;
  }
  g("rColors").querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",b.dataset.c===color&&tool!=="eraser"));
  const more=g("rMore");more.style.setProperty("--c",color);more.classList.toggle("on",!quick.includes(color)&&tool!=="eraser");
}
function syncTools(){
  document.querySelectorAll("#rToolSel [data-tool]").forEach(b=>{const on=b.dataset.tool===tool;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  renderQuick();
  document.querySelectorAll("#rSizes [data-size]").forEach(b=>{const on=+b.dataset.size===size;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  g("rTools").style.setProperty("--c",color);
  g("rFinger").classList.toggle("on",finger);g("rFinger").setAttribute("aria-pressed",finger);
  g("rUndo").disabled=!undoStack.length;g("rRedo").disabled=!redoStack.length;g("rClear").disabled=!strokes.length;
  const b=R.book;g("rPrev").disabled=!b||R.page<=1;g("rNext").disabled=!b||R.page>=b.pages;
}
function pickColor(c,fromPop){
  color=c.toLowerCase();pref("color",color);
  if(tool==="eraser"){tool="pen";pref("tool",tool)}
  if(fromPop&&!quick.includes(color)){quick=[color,...quick].slice(0,5);pref("quick",JSON.stringify(quick))}
  syncTools();
}
g("rToolSel").addEventListener("click",e=>{const b=e.target.closest("[data-tool]");if(!b)return;tool=b.dataset.tool;pref("tool",tool);syncTools()});
g("rSizes").addEventListener("click",e=>{const b=e.target.closest("[data-size]");if(!b)return;size=+b.dataset.size;pref("size",String(size));if(tool==="eraser"){tool="pen";pref("tool",tool)}syncTools()});
g("rColors").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="rMore"){g("rPop").hidden?openPop():closePop();return}
  pickColor(b.dataset.c,false);
});
g("rUndo").onclick=undo;g("rRedo").onclick=redo;
g("rClear").onclick=()=>{if(!strokes.length)return;const before=strokes.slice();strokes=[];commit(before);requestRender()};
g("rFit").onclick=fitView;
g("rFinger").onclick=()=>{finger=!finger;pref("finger",finger?"1":"0");syncTools()};
g("rPrev").onclick=()=>goPage(R.page-1);
g("rNext").onclick=()=>goPage(R.page+1);
g("rPageNo").addEventListener("change",()=>{g("rPageNo").blur();goPage(g("rPageNo").value)});
g("rPageNo").addEventListener("keydown",e=>{if(e.key==="Enter")g("rPageNo").blur()});
g("rRetry").onclick=()=>goPage(R.page);
g("rBack").onclick=()=>closeReader();
g("rGridBtn").onclick=()=>{g("rGrid").hidden?openGrid():closeGrid()};

/* ---------- renk paleti ve özel renk seçici ---------- */
const pop=g("rPop");let cp={h:215,s:.85,v:.82},drag=null;
function hexToHsv(hex){
  const r=parseInt(hex.slice(1,3),16)/255,gg=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((gg-b)/d)%6;else if(mx===gg)h=(b-r)/d+2;else h=(r-gg)/d+4;h*=60;if(h<0)h+=360}
  return {h,s:mx?d/mx:0,v:mx};
}
function hsvToHex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return "#"+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const swHtml=(c,n)=>`<button type="button" class="sw${c===color?" on":""}" data-c="${c}" style="--c:${c}" aria-label="${n}"><i></i></button>`;
function openPop(){
  closeGrid();
  pop.innerHTML=`<div class="pop-h"><b>Renkler</b><button type="button" class="ib sm" data-pop="close" aria-label="Kapat">${IC.x}</button></div>
    <div class="pal">${PALETTE.map(([c,n])=>swHtml(c,n)).join("")}</div>
    <div class="pop-sub">Özel renklerin</div>
    <div class="pal">${custom.map(c=>swHtml(c,"Özel renk")).join("")}<button type="button" class="sw sw-add" data-pop="new" aria-label="Yeni renk oluştur"><i>${IC.plus}</i></button></div>
    <div class="cp" id="rCp" hidden>
      <div class="cp-sv" id="rSv"><span class="knob" id="rSvK"></span></div>
      <div class="cp-hue" id="rHue"><span class="knob" id="rHueK"></span></div>
      <div class="cp-row"><span class="cp-prev" id="rCpPrev"></span><span class="cp-hex" id="rCpHex"></span><button type="button" class="btn pri small" data-pop="use">Bu rengi kullan</button></div>
    </div>`;
  pop.hidden=false;
  const btn=g("rMore").getBoundingClientRect(),W=pop.offsetWidth;
  const left=Math.max(8,Math.min(innerWidth-W-8,btn.left+btn.width/2-W/2));
  pop.style.left=left+"px";pop.style.top=(btn.bottom+10)+"px";pop.style.maxHeight=Math.max(240,innerHeight-btn.bottom-22)+"px";
  pop.style.setProperty("--ax",(btn.left+btn.width/2-left)+"px");
  g("rMore").setAttribute("aria-expanded","true");
}
function closePop(){if(pop.hidden)return;pop.hidden=true;pop.innerHTML="";drag=null;const m=g("rMore");if(m)m.setAttribute("aria-expanded","false")}
function cpPaint(){
  const hx=hsvToHex(cp.h,cp.s,cp.v);
  g("rSv").style.background=`linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(${cp.h},100%,50%))`;
  const k=g("rSvK");k.style.left=cp.s*100+"%";k.style.top=(1-cp.v)*100+"%";k.style.background=hx;
  const hk=g("rHueK");hk.style.left=cp.h/360*100+"%";hk.style.background=`hsl(${cp.h},100%,50%)`;
  g("rCpPrev").style.background=hx;g("rCpHex").textContent=hx.toUpperCase();
}
function dragUpd(e){
  const r=drag.el.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  if(drag.el.id==="rSv"){cp.s=x;cp.v=1-y}else cp.h=Math.min(359.9,x*360);
  cpPaint();
}
pop.addEventListener("pointerdown",e=>{const el=e.target.closest("#rSv,#rHue");if(!el)return;e.preventDefault();drag={el,id:e.pointerId};try{el.setPointerCapture(e.pointerId)}catch(_){}dragUpd(e)});
pop.addEventListener("pointermove",e=>{if(drag&&e.pointerId===drag.id)dragUpd(e)});
["pointerup","pointercancel"].forEach(t=>pop.addEventListener(t,e=>{if(drag&&e.pointerId===drag.id)drag=null}));
pop.addEventListener("click",e=>{
  const b=e.target.closest("[data-c],[data-pop]");if(!b)return;
  if(b.dataset.c){pickColor(b.dataset.c,true);closePop();return}
  const a=b.dataset.pop;
  if(a==="close")closePop();
  else if(a==="new"){const box=g("rCp");box.hidden=false;const h=hexToHsv(color);cp=h.s<.08?{h:215,s:.85,v:.82}:h;cpPaint();box.scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"})}
  else if(a==="use"){const hx=hsvToHex(cp.h,cp.s,cp.v);custom=[hx,...custom.filter(c=>c!==hx)].slice(0,12);pref("custom",JSON.stringify(custom));pickColor(hx,true);closePop()}
});
rd.addEventListener("pointerdown",e=>{
  if(pop.hidden||pop.contains(e.target)||e.target.closest("#rMore"))return;
  closePop();
  if(stage.contains(e.target)){e.stopPropagation();e.preventDefault()}
},true);

/* ---------- sayfa önizlemeleri ---------- */
let io=null;
async function openGrid(){
  const b=R.book;if(!b)return;closePop();
  const sh=g("rGrid"),box=g("rThumbs"),tok=++gridToken;
  sh.hidden=false;g("rGridBtn").classList.add("on");g("rGridNote").textContent="";box.innerHTML="";
  const drawn=new Set();
  await idbEach("strokes",b.id+"/",(k,v)=>{if(v&&v.s&&v.s.length)drawn.add(+String(k).slice(b.id.length+1))});
  if(tok!==gridToken)return;
  const ar=b.w&&b.h?b.w+"/"+b.h:"1/1.414";let h="";
  for(let n=1;n<=b.pages;n++)h+=`<button type="button" class="r-th${n===R.page?" cur":""}" data-n="${n}" aria-label="${n}. sayfa${drawn.has(n)?", çözüm var":""}"><span class="im" style="aspect-ratio:${ar}">${drawn.has(n)?'<i class="dot"></i>':""}<img alt="" data-n="${n}"></span><span>${n}</span></button>`;
  box.innerHTML=h;
  g("rGridNote").textContent=drawn.size?`${drawn.size} sayfada çözümün var`:"";
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;io.unobserve(en.target);const im=en.target,n=+im.dataset.n;
    thumbUrl(b.id,n,tok).then(u=>{im.onload=()=>im.classList.add("on");im.src=u}).catch(()=>{});
  }),{root:box,rootMargin:"300px 0px"});
  box.querySelectorAll("img").forEach(i=>io.observe(i));
  const cur=box.querySelector(".cur");if(cur)cur.scrollIntoView({block:"center"});
}
function closeGrid(){const sh=g("rGrid");if(sh.hidden)return;sh.hidden=true;gridToken++;if(io){io.disconnect();io=null}g("rThumbs").innerHTML="";g("rGridBtn").classList.remove("on")}
g("rThumbs").addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b)return;const n=+b.dataset.n;closeGrid();if(n!==R.page)goPage(n)});
g("rGridClose").onclick=closeGrid;

/* ---------- klavye, boyut ---------- */
document.addEventListener("keydown",e=>{
  if(!R.open)return;
  if(e.key==="Escape"){if(!pop.hidden)closePop();else if(!g("rGrid").hidden)closeGrid();else closeReader();return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName||""))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();if(R.book&&R.page<R.book.pages)goPage(R.page+1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();if(R.page>1)goPage(R.page-1)}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
});
if(window.ResizeObserver)new ResizeObserver(()=>{if(R.open)placeStage()}).observe(g("rBar"));
window.addEventListener("resize",()=>{if(R.open){closePop();placeStage()}});
window.addEventListener("orientationchange",()=>setTimeout(()=>{if(R.open){placeStage();fitView()}},250));

function init(){
  idbEach("strokes","",(k,v)=>{if(v&&v.d)dirty.add(k)}).then(()=>{if(dirty.size)scheduleSync(1500)});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
return {view,mount,init,isOpen:()=>R.open};
})();

BK.init();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
renderHeader();
boot();
})();
</script>
